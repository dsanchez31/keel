# Standard reconnaissance doctrine, 2.2.0.
#
# Changes from 2.1.0:
#   - rtb-on-low-battery no longer fires for a vector already returning to
#     base. On the way home rtb_cost_pct falls about as fast as battery_pct,
#     so battery-reserve flickers between held and violated, and every flicker
#     re-fired the rule: another redecomposition of the unassigned pool, for a
#     vector that was already doing the only thing the rule asks. The rule id
#     is kept although the condition narrows: the rule has no duration
#     window, so a hot swap retains nothing for it that could fire early
#     (design section 10, item 7).
#
# Grammar and semantics: spec.md section 6.
apiVersion: keel.doctrine/v1
name: recon-standard
version: 2.2.0

params:
  # Battery held back from every range computation: allocation, plan
  # feasibility and the battery-reserve constraint all read this one value.
  battery_reserve_pct: 15

roles:
  - id: scanner
    requires: [aerial, camera]
  - id: ground-scanner
    requires: [camera, ground]
  - id: relay
    requires: [aerial, radio_mesh]

constraints:
  # Enough battery to reach the nearest GCS, plus the reserve.
  - id: battery-reserve
    rule: agent.battery_pct >= agent.rtb_cost_pct + doctrine.battery_reserve_pct
  # The AO bounds lane work. Transit to and from a GCS outside the AO is not
  # lane work, so a fleet idle at its base passes gate 4.
  - id: geofence
    rule: agent.mode != SCANNING or agent.position within mission.area

rules:
  - id: return-on-geofence-breach
    when: violates(geofence)
    then: return_to_base(agent), release_lanes(agent), redecompose(policy=nearest_capable), notify_operator(message="geofence breach")
    priority: 300

  - id: rtb-on-low-battery
    when: violates(battery-reserve) and agent.mode != RTB
    then: return_to_base(agent), release_lanes(agent), redecompose(policy=nearest_capable)
    priority: 200

  - id: reassign-on-link-loss
    when: agent.link_state == LOST for 5s
    then: release_lanes(agent), redecompose(policy=nearest_capable)
    priority: 100

  - id: notify-on-degraded-link
    when: agent.link_state == DEGRADED for 3s
    then: notify_operator(message="link degraded")
    priority: 10
